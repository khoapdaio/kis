server:
  port: 8010
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/taxonomy
    username: khoapd
    password: khoapd
  jpa:
    hibernate:
      # create, update, create-drop, validate và none
      ddl-auto: update
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    baseline-on-migrate: true
    enabled: false
    baseline-description: "init"
    baseline-version: 0
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
eureka:
  instance:
    metadataMap:
      grpcPort: 9090
springdoc:
  api-docs:
    enabled: true
    path: /taxonomy/v3/api-docs
  swagger-ui:
    enabled: true